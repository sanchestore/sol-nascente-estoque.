<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sol Nascente — Controle de Estoque</title>
<style>
  :root{
    --bg:#F7EEDF;
    --bg-panel:#FFFCF6;
    --bg-inset:#F0E4CC;
    --ink:#2E1D14;
    --ink-soft:#7A6650;
    --gold:#C9862B;
    --gold-dark:#9C6A1F;
    --brick:#A63D2F;
    --brick-bg:#F6E1DC;
    --amber:#D9A441;
    --amber-bg:#FBF0D9;
    --green:#4C7A4A;
    --green-bg:#E7F0E3;
    --line:#E4D5BC;
    --line-strong:#D3BE95;
    --shadow:0 1px 2px rgba(46,29,20,0.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;}
  ::selection{background:var(--amber-bg);}

  #app{max-width:1080px;margin:0 auto;padding:0 16px 60px;}

  header.top{
    padding:22px 4px 16px;
    border-bottom:2px solid var(--line-strong);
    margin-bottom:18px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  header.top .brand{display:flex;align-items:center;gap:12px;}
  .logo-mark{
    width:52px;height:52px;flex:none;border-radius:12px;object-fit:cover;
    box-shadow:0 1px 4px rgba(46,29,20,0.18);
  }
  header.top .titles h1{
    margin:0;font-size:22px;letter-spacing:0.2px;color:var(--ink);
  }
  header.top .titles p{
    margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);
  }
  .user-box{display:flex;align-items:center;gap:10px;}
  .user-chip{
    font-size:12.5px;background:var(--bg-inset);color:var(--ink);
    padding:6px 11px;border-radius:20px;font-weight:600;
  }
  .btn-logout{
    background:none;border:1px solid var(--line-strong);color:var(--ink-soft);
    font-size:12.5px;padding:7px 12px;border-radius:7px;cursor:pointer;
  }

  /* ---- Login ---- */
  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);padding:20px;
  }
  .login-card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;
    padding:32px 28px;max-width:340px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(46,29,20,.1);
  }
  .login-card img{width:90px;height:90px;border-radius:16px;margin-bottom:14px;box-shadow:0 1px 6px rgba(46,29,20,.2);}
  .login-card h1{font-size:19px;margin:0 0 2px;}
  .login-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
  .login-card input{margin-bottom:10px;}
  .login-err{color:var(--brick);font-size:12.5px;min-height:16px;margin-bottom:6px;}
  .login-loading{color:var(--ink-soft);font-size:13px;text-align:center;padding:40px;}

  nav.tabs{
    display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:20px;
    border-bottom:1px solid var(--line);
    -ms-overflow-style:none;scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:none;background:none;border:none;cursor:pointer;
    font-family:Georgia,serif;font-size:14.5px;color:var(--ink-soft);
    padding:9px 14px;border-bottom:3px solid transparent;white-space:nowrap;
    transition:color .15s, border-color .15s;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{color:var(--brick);border-bottom-color:var(--brick);font-weight:bold;}
  nav.tabs button .badge{
    display:inline-block;min-width:16px;padding:0 4px;margin-left:6px;
    background:var(--brick);color:#fff;border-radius:9px;font-size:10.5px;
    line-height:16px;text-align:center;font-family:inherit;
  }

  .panel{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;
    padding:18px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .panel h2{margin:0 0 14px;font-size:17px;}
  .grid-cards{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
    margin-bottom:18px;
  }
  .stat{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;box-shadow:var(--shadow);
  }
  .stat .num{font-family:Georgia,serif;font-size:26px;line-height:1.1;}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .stat.warn .num{color:var(--amber);}
  .stat.crit .num{color:var(--brick);}
  .stat.ok .num{color:var(--green);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;font-size:11.5px;text-transform:none;color:var(--ink-soft);
    border-bottom:1px solid var(--line-strong);padding:6px 8px;font-weight:600;
  }
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .tbl-wrap{overflow-x:auto;}
  code.code{
    background:var(--bg-inset);border-radius:5px;padding:2px 6px;font-size:12px;
    font-family:ui-monospace,Menlo,monospace;color:var(--gold-dark);
  }

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;}
  .pill.ok{background:var(--green-bg);color:var(--green);}
  .pill.warn{background:var(--amber-bg);color:#8a6417;}
  .pill.crit{background:var(--brick-bg);color:var(--brick);}

  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:0 0 4px;}
  input,select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:7px;
    background:#fff;color:var(--ink);font-size:14px;font-family:inherit;
  }
  textarea{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .field{margin-bottom:12px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:520px){.row2,.row3{grid-template-columns:1fr;}}

  button.btn{
    font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:7px;
    padding:10px 18px;cursor:pointer;transition:opacity .15s,transform .1s;
  }
  button.btn:active{transform:scale(.98);}
  button.btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn-primary{background:var(--brick);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-secondary{background:var(--bg-inset);color:var(--ink);}
  .btn-ghost{background:none;color:var(--ink-soft);text-decoration:underline;padding:6px 4px;}
  .btn-danger{background:none;color:var(--brick);padding:4px 6px;font-weight:600;}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px;}

  .empty{
    text-align:center;color:var(--ink-soft);padding:36px 10px;font-size:14px;
  }
  .divider{height:1px;background:var(--line);margin:16px 0;}

  .banner{
    display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;
    margin-bottom:14px;font-size:13.5px;
  }
  .banner.crit{background:var(--brick-bg);color:#7a2e23;}
  .banner.warn{background:var(--amber-bg);color:#7a5b13;}
  .banner.info{background:var(--bg-inset);color:var(--ink);}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13.5px;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.2);
  }
  .muted{color:var(--ink-soft);}
  .right{text-align:right;}
  .bar-bg{background:var(--bg-inset);border-radius:5px;height:6px;overflow:hidden;margin-top:5px;}
  .bar-fill{height:100%;border-radius:5px;}
  .imp-row select, .imp-row input{font-size:12.5px;padding:6px 8px;}
</style>
</head>

function tentarLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errBox = document.getElementById('login-err');
  errBox.textContent = 'Entrando...';
  auth.signInWithEmailAndPassword(email, pass).catch(err=>{
    let msg = 'Não foi possível entrar.';
    if(err.code==='auth/invalid-email') msg = 'E-mail inválido.';
    if(err.code==='auth/user-not-found' || err.code==='auth/invalid-credential') msg = 'E-mail ou senha incorretos.';
    if(err.code==='auth/wrong-password') msg = 'Senha incorreta.';
    if(err.code==='auth/too-many-requests') msg = 'Muitas tentativas. Aguarde um pouco.';
    errBox.textContent = msg;
  });
}
function fazerLogout(){
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById('login-root').innerHTML = '';
    document.getElementById('app').style.display = '';
    document.getElementById('user-chip').textContent = currentUserLabel();
    iniciarSincronizacao();
  } else {
    if(unsubProducts) unsubProducts();
    if(unsubMovements) unsubMovements();
    if(unsubInvoices) unsubInvoices();
    loaded = false;
    renderLogin();
  }
});

/* ======================= SINCRONIZAÇÃO EM TEMPO REAL (Firestore) ======================= */
async function iniciarSincronizacao(){
  document.getElementById('content').innerHTML = '<div class="panel"><p class="empty">Sincronizando dados…</p></div>';
  await garantirSeed();

  unsubProducts = productsCol.onSnapshot(snap=>{
    state.products = snap.docs.map(d=>({ code:d.id, ...d.data() }));
    loaded = true;
    render();
  }, err=> showToast('Erro ao sincronizar produtos: '+err.message));

  unsubMovements = movementsCol.orderBy('ts','desc').limit(300).onSnapshot(snap=>{
    state.movements = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, err=> showToast('Erro ao sincronizar movimentações: '+err.message));

  unsubInvoices = invoicesCol.orderBy('ts','desc').limit(300).onSnapshot(snap=>{
    state.invoices = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    render();
  }, err=> showToast('Erro ao sincronizar notas: '+err.message));
}

async function garantirSeed(){
  try{
    const snap = await productsCol.limit(1).get();
    if(snap.empty){
      const batch = db.batch();
      SEED_PRODUCTS.forEach(p=>{
        const ref = productsCol.doc(p.code);
        batch.set(ref, {
          name:p.name, category:p.category, unit:p.unit, location:p.location,
          min:p.min, max:p.max, lastCost:p.lastCost, batches:p.batches
        });
      });
      await batch.commit();
    }
  }catch(e){ showToast('Erro ao carregar dados iniciais: '+e.message); }
}

/* ======================= HELPERS ======================= */
function fmtMoney(v){
  return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function daysUntil(iso){
  if(!iso) return null;
  const today = new Date(todayISO()+'T00:00:00');
  const target = new Date(iso+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function catPrefix(cat){
  const found = CATEGORIES.find(c=>c[0]===cat);
  return found ? found[1] : "OUT";
}
function nextCode(cat){
  const prefix = catPrefix(cat);
  const existing = state.products
    .filter(p=>p.code.startsWith(prefix))
    .map(p=> parseInt(p.code.slice(prefix.length),10) || 0);
  const n = existing.length ? Math.max(...existing)+1 : 1;
  return prefix + String(n).padStart(3,'0');
}
function totalStock(p){
  return (p.batches||[]).reduce((s,b)=>s+b.qty,0);
}
function stockStatus(p){
  const qty = totalStock(p);
  if(qty<=0 || qty < p.min*0.5) return 'crit';
  if(qty < p.min) return 'warn';
  return 'ok';
}
function nearestValidade(p){
  const withDate = (p.batches||[]).filter(b=>b.validade);
  if(!withDate.length) return null;
  return withDate.reduce((a,b)=> a.validade < b.validade ? a : b);
}
function stockValue(){
  return state.products.reduce((sum,p)=> sum + totalStock(p) * (p.lastCost||0), 0);
}
function invoicesThisMonth(){
  const ym = todayISO().slice(0,7);
  return state.invoices.filter(i=>i.date && i.date.slice(0,7)===ym);
}
function showToast(msg){
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
function productByCode(code){ return state.products.find(p=>p.code===code); }

/* ======================= MOVIMENTAÇÕES (Firestore) ======================= */
async function registrarEntrada({productCode, qty, lote, validade, invoiceNumber, unitCost, fornecedor}){
  const ref = productsCol.doc(productCode);
  const snap = await ref.get();
  if(!snap.exists){ showToast('Produto não encontrado.'); return; }
  const p = snap.data();
  const batches = (p.batches||[]).concat([{ id: uid(), qty, lote: lote||null, validade: validade||null }]);
  const updates = { batches };
  if(unitCost){ updates.lastCost = unitCost; }
  await ref.update(updates);
  await movementsCol.add({
    productCode, productName:p.name, type:'entrada', qty, date: todayISO(),
    detail: lote ? `Lote ${lote}` : '', user: currentUserLabel(),
    ts: firebase.firestore.FieldValue.serverTimestamp()
  });
  if(invoiceNumber){
    await invoicesCol.add({
      invoiceNumber, date: todayISO(), productCode, productName:p.name, qty,
      unitCost: unitCost||0, total: (unitCost||0)*qty, fornecedor: fornecedor||'',
      user: currentUserLabel(), ts: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
}

async function registrarSaida({productCode, qty, motivo}){
  const ref = productsCol.doc(productCode);
  const snap = await ref.get();
  if(!snap.exists) return false;
  const p = snap.data();
  const total = (p.batches||[]).reduce((s,b)=>s+b.qty,0);
  if(total < qty) return false;
  let remaining = qty;
  const batches = (p.batches||[]).slice().sort((a,b)=>{
    if(!a.validade && !b.validade) return 0;
    if(!a.validade) return 1;
    if(!b.validade) return -1;
    return a.validade < b.validade ? -1 : 1;
  });
  for(const b of batches){
    if(remaining<=0) break;
    const take = Math.min(b.qty, remaining);
    b.qty -= take;
    remaining -= take;
  }
  const newBatches = batches.filter(b=>b.qty>0);
  await ref.update({ batches: newBatches });
  await movementsCol.add({
    productCode, productName:p.name, type:'saida', qty, date: todayISO(), detail: motivo||'',
    user: currentUserLabel(), ts: firebase.firestore.FieldValue.serverTimestamp()
  });
  return true;
}

/* ======================= RENDER: TABS ======================= */
const TABS = [
  {id:'painel', label:'Painel'},
  {id:'produtos', label:'Produtos'},
  {id:'entrada', label:'Entrada'},
  {id:'saida', label:'Saída'},
  {id:'compras', label:'Compras / NF'},
  {id:'alertas', label:'Alertas'},
  {id:'backup', label:'Backup'},
];

function alertCount(){
  const low = state.products.filter(p=>stockStatus(p)!=='ok').length;
  const exp = state.products.reduce((n,p)=>{
    const nv = nearestValidade(p);
    if(nv && daysUntil(nv.validade) <= 7) n++;
    return n;
  },0);
  return low+exp;
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  TABS.forEach(t=>{
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.className = t.id===currentTab ? 'active':'';
    if(t.id==='alertas'){
      const c = alertCount();
      if(c>0){
        const b = document.createElement('span');
        b.className='badge'; b.textContent=c;
        btn.appendChild(b);
      }
    }
    btn.onclick = ()=>{ currentTab=t.id; render(); };
    nav.appendChild(btn);
  });
}

/* ======================= RENDER: PAINEL ======================= */
function renderPainel(){
  const low = state.products.filter(p=>stockStatus(p)==='warn').length;
  const crit = state.products.filter(p=>stockStatus(p)==='crit').length;
  const nearExp = state.products.filter(p=>{
    const nv = nearestValidade(p);
    return nv && daysUntil(nv.validade)<=7 && daysUntil(nv.validade)>=0;
  }).length;
  const expired = state.products.filter(p=>{
    const nv = nearestValidade(p);
    return nv && daysUntil(nv.validade)<0;
  }).length;
  const monthTotal = invoicesThisMonth().reduce((s,i)=>s+i.total,0);
  const last = state.movements[0];

  let html = '';
  if(last){
    html += `<div class="banner info">
      <strong>Última movimentação:</strong>&nbsp; ${last.user||'—'} · ${last.productName||''} ·
      ${last.type==='entrada'?'entrada':'saída'} de ${last.qty} · ${fmtDate(last.date)}
    </div>`;
  }

  html += `<div class="grid-cards">
    <div class="stat"><div class="num">${fmtMoney(stockValue())}</div><div class="lbl">Valor em estoque</div></div>
    <div class="stat"><div class="num">${state.products.length}</div><div class="lbl">Produtos cadastrados</div></div>

    <div class="stat crit"><div class="num">${crit}</div><div class="lbl">Estoque crítico</div></div>
    <div class="stat warn"><div class="num">${nearExp}</div><div class="lbl">Vencendo em 7 dias</div></div>
    <div class="stat crit"><div class="num">${expired}</div><div class="lbl">Vencidos</div></div>
    <div class="stat"><div class="num">${fmtMoney(monthTotal)}</div><div class="lbl">Compras este mês</div></div>
  </div>`;

  html += `<div class="panel">
    <h2>Separação por câmara fria</h2>
    ${renderCamaraBreakdown()}
  </div>`;

  if(crit+low+nearExp+expired > 0){
    html += `<div class="panel">
      <h2>Precisa de atenção</h2>
      ${renderAttentionList()}
    </div>`;
  }

  html += `<div class="panel">
    <h2>Últimas movimentações</h2>
    ${renderMovementsTable(8)}
  </div>`;

  document.getElementById('content').innerHTML = html;
}

function renderCamaraBreakdown(){
  const cats = Object.keys(CAMARA_INFO);
  const cards = cats.map(cat=>{
    const info = CAMARA_INFO[cat];
    const items = state.products.filter(p=>p.category===cat);
    if(!items.length) return '';
    const value = items.reduce((s,p)=>s+totalStock(p)*(p.lastCost||0),0);
    const critCount = items.filter(p=>stockStatus(p)==='crit').length;
    const warnCount = items.filter(p=>stockStatus(p)==='warn').length;
    return `<div class="stat" style="border-top:4px solid ${info.color};">
      <div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;">${info.camara}</div>
      <div style="font-weight:bold;font-size:14px;margin:2px 0 8px;">${cat}</div>
      <div style="font-size:12.5px;" class="muted">${items.length} itens · ${fmtMoney(value)}</div>
      ${(critCount+warnCount)>0 ? `<div style="margin-top:6px;">${critCount? `<span class="pill crit">${critCount} crítico</span> `:''}${warnCount? `<span class="pill warn">${warnCount} baixo</span>`:''}</div>` : `<div style="margin-top:6px;"><span class="pill ok">OK</span></div>`}
    </div>`;
  }).join('');
  return `<div class="grid-cards">${cards}</div>`;
}

function renderAttentionList(){
  const rows = [];
  state.products.forEach(p=>{
    const status = stockStatus(p);
    if(status!=='ok'){
      rows.push(`<tr>
        <td><code class="code">${p.code}</code></td>
        <td>${p.name}</td>
        <td>${totalStock(p)} ${p.unit} <span class="muted">/ mín ${p.min}</span></td>
        <td><span class="pill ${status}">${status==='crit'?'Crítico':'Baixo'}</span></td>
        <td class="right"><button class="btn btn-secondary btn-sm" onclick="goToEntradaFor('${p.code}')">Repor</button></td>
      </tr>`);
    }
    const nv = nearestValidade(p);
    if(nv){
      const d = daysUntil(nv.validade);
      if(d<=7){
        const lvl = d<0 ? 'crit' : (d<=3?'crit':'warn');
        const lbl = d<0 ? `Vencido há ${Math.abs(d)}d` : (d===0? 'Vence hoje' : `Vence em ${d}d`);
        rows.push(`<tr>
          <td><code class="code">${p.code}</code></td>
          <td>${p.name} <span class="muted">${nv.lote?('· lote '+nv.lote):''}</span></td>
          <td>${nv.qty} ${p.unit} <span class="muted">· ${fmtDate(nv.validade)}</span></td>
          <td><span class="pill ${lvl}">${lbl}</span></td>
          <td></td>
        </tr>`);
      }
    }
  });
  if(!rows.length) return '<p class="empty">Tudo em ordem.</p>';
  return `<div class="tbl-wrap"><table>
    <tr><th>Código</th><th>Produto</th><th>Situação</th><th>Alerta</th><th></th></tr>
    ${rows.join('')}
  </table></div>`;
}

  if(q) list = list.filter(p=> p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q));
  if(cat) list = list.filter(p=> p.category===cat);

async function salvarProduto(){
  const name = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-cat').value;
  let code = document.getElementById('f-code').value.trim().toUpperCase();
  const unit = document.getElementById('f-unit').value;
  const location = document.getElementById('f-loc').value.trim();
  const min = parseFloat(document.getElementById('f-min').value)||0;
  const max = parseFloat(document.getElementById('f-max').value)||0;
  const init = parseFloat(document.getElementById('f-init').value)||0;

  if(!name){ showToast('Digite o nome do produto.'); return; }

  if(editingProductCode){
    await productsCol.doc(editingProductCode).update({ name, category, unit, location, min, max });
    editingProductCode = null;
    showToast('Produto atualizado.');
  } else {
    if(!code) code = nextCode(category);
    if(productByCode(code)){ showToast('Já existe um produto com esse código.'); return; }
    const batches = init>0 ? [{id:uid(), qty:init, lote:null, validade:null}] : [];
    await productsCol.doc(code).set({ name, category, unit, location, min, max, lastCost:0, batches });
    if(init>0){
      await movementsCol.add({productCode:code, productName:name, type:'entrada', qty:init, date: todayISO(), detail:'Estoque inicial', user: currentUserLabel(), ts: firebase.firestore.FieldValue.serverTimestamp()});
    }
    showToast('Produto cadastrado.');
  }
  renderProdutos();
}

function editarProduto(code){ editingProductCode=code; renderProdutos(); window.scrollTo({top:0,behavior:'smooth'}); }
function cancelarEdicao(){ editingProductCode=null; renderProdutos(); }
async function excluirProduto(code){
  const p = productByCode(code);
  if(!p) return;
  if(!confirm(`Excluir "${p.name}"? Isso não apaga o histórico de movimentações já registrado.`)) return;
  await productsCol.doc(code).delete();
  showToast('Produto excluído.');
}

/* ---- Análise (parser) da página da nota fiscal ---- */
function parseNumeroBR(txt){
  if(!txt) return 0;
  const clean = txt.replace(/[^\d,.-]/g,'').trim();
  if(!clean) return 0;
  // formato brasileiro: 1.234,56  -> remove pontos de milhar, troca vírgula por ponto
  const semMilhar = clean.replace(/\.(?=\d{3}(\D|$))/g,'');
  const normalizado = semMilhar.replace(',', '.');
  const n = parseFloat(normalizado);
  return isNaN(n) ? 0 : n;
}

function extrairItensDaNota(texto){
  const itens = [];
  try{
    const doc = new DOMParser().parseFromString(texto, 'text/html');
    // Estratégia 1: portal nacional da NF-e usa uma tabela com id "tabResult"
    let tabela = doc.querySelector('#tabResult') || doc.querySelector('.tabResult');
    let linhas = tabela ? Array.from(tabela.querySelectorAll('tr')) : [];
    // Estratégia 2 (genérica): qualquer tabela com várias linhas contendo números
    if(!linhas.length){
      const tabelas = Array.from(doc.querySelectorAll('table'));
      for(const t of tabelas){
        const trs = Array.from(t.querySelectorAll('tr')).filter(tr=> tr.querySelectorAll('td').length>=3);
        if(trs.length > linhas.length) linhas = trs;
      }
    }
    linhas.forEach(tr=>{
      const tds = Array.from(tr.querySelectorAll('td')).map(td=>td.textContent.replace(/\s+/g,' ').trim()).filter(t=>t.length);
      if(tds.length < 3) return;
      // acha células numéricas (quantidade / valores)
      const numericos = tds.map((t,idx)=>({idx, val: parseNumeroBR(t), raw:t}))
        .filter(o=> /\d/.test(o.raw) && !/^[A-Za-zÀ-ÿ]{3,}/.test(o.raw));
      if(numericos.length < 2) return;
      // descrição = maior célula textual (não numérica)
      const textuais = tds.map((t,idx)=>({idx,t})).filter(o=> !/^[\d.,\s%R$-]+$/.test(o.t));
      if(!textuais.length) return;
      const descricaoObj = textuais.reduce((a,b)=> b.t.length>a.t.length? b:a);
      const descricao = descricaoObj.t;
      if(descricao.length < 3) return;
      // código = primeira célula curta alfanumérica antes da descrição
      let codigo = '';
      for(const o of tds){ if(o!==descricao && /^[A-Za-z0-9.]{2,15}$/.test(o) && o.length<15){ codigo=o; break; } }
      // valores: pega os dois últimos números plausíveis como (quantidade, valor unit ou total)
      const vistos = numericos.filter(o=>o.val>0);
      let quantidade = 0, valorUnit = 0, valorTotal = 0;
      if(vistos.length>=3){
        quantidade = vistos[vistos.length-3].val;
        valorUnit = vistos[vistos.length-2].val;
        valorTotal = vistos[vistos.length-1].val;
      } else if(vistos.length===2){
        quantidade = vistos[0].val;
        valorTotal = vistos[1].val;
        valorUnit = quantidade? valorTotal/quantidade : 0;
      }
      if(quantidade>0){
        itens.push({ codigoNota: codigo, descricao, quantidade, valorUnit: valorUnit||0, valorTotal: valorTotal||(quantidade*valorUnit) });
      }
    });
  }catch(e){ /* ignora e deixa lista vazia */ }
  // remove duplicados óbvios (mesma descrição e quantidade repetida por causa de cabeçalhos)
  const vistos = new Set();
  return itens.filter(it=>{
    const key = it.descricao+'|'+it.quantidade+'|'+it.valorTotal;
    if(vistos.has(key)) return false;
    vistos.add(key);
    return true;
  });
}

function melhorMatch(descricao){
  const d = descricao.toLowerCase();
  let melhor = null, melhorScore = 0;
  state.products.forEach(p=>{
    const n = p.name.toLowerCase();
    let score = 0;
    if(n===d) score = 100;
    else if(n.includes(d) || d.includes(n)) score = 60;
    else {
      const palavrasD = d.split(/\s+/).filter(w=>w.length>2);
      const palavrasN = n.split(/\s+/).filter(w=>w.length>2);
      const comuns = palavrasD.filter(w=>palavrasN.includes(w));
      score = comuns.length * 10;
    }
    if(score>melhorScore){ melhorScore=score; melhor=p; }
  });
  return melhorScore>=10 ? melhor : null;
}

function analisarNota(){
  const texto = document.getElementById('nf-html').value;
  if(!texto.trim()){ showToast('Cole o conteúdo da nota primeiro.'); return; }
  const itens = extrairItensDaNota(texto);
  parsedNfItems = itens.map(it=>{
    const match = melhorMatch(it.descricao);
    return { ...it, productCode: match? match.code : '' };
  });
  document.getElementById('nf-resultado').innerHTML = renderRevisaoNota();
}

function renderRevisaoNota(){
  if(!parsedNfItems.length){
    return `<div class="banner warn">Não consegui identificar itens automaticamente nesse conteúdo. Confira se colou a página inteira da nota (com a tabela de produtos), ou lance manualmente na aba Entrada.</div>`;
  }
  const prodOpts = (selecionado)=> `<option value="">— não importar —</option>` + state.products.map(p=>
    `<option value="${p.code}" ${p.code===selecionado?'selected':''}>${p.code} — ${p.name}</option>`).join('');
  const rows = parsedNfItems.map((it,idx)=>`
    <tr class="imp-row">
      <td style="max-width:220px;">${it.descricao}<div class="muted" style="font-size:11px;">${it.codigoNota||''}</div></td>
      <td><select onchange="parsedNfItems[${idx}].productCode=this.value">${prodOpts(it.productCode)}</select></td>
      <td><input type="number" step="0.01" value="${it.quantidade}" onchange="parsedNfItems[${idx}].quantidade=parseFloat(this.value)||0" style="width:80px;"></td>
      <td><input type="number" step="0.01" value="${it.valorUnit.toFixed(2)}" onchange="parsedNfItems[${idx}].valorUnit=parseFloat(this.value)||0" style="width:90px;"></td>
    </tr>`).join('');
  return `
    <div class="banner info">Confira o produto de cada linha antes de confirmar. Linhas sem produto selecionado não serão importadas.</div>
    <div class="tbl-wrap"><table>
      <tr><th>Descrição na nota</th><th>Produto no sistema</th><th>Qtd</th><th>Valor unit.</th></tr>
      ${rows}
    </table></div>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="confirmarImportacaoNota()">Confirmar e lançar entradas</button>
  `;
}

async function confirmarImportacaoNota(){
  const invoiceNumber = document.getElementById('nf-numero').value.trim();
  const fornecedor = document.getElementById('nf-fornecedor').value.trim();
  const validos = parsedNfItems.filter(it=>it.productCode && it.quantidade>0);
  if(!validos.length){ showToast('Selecione ao menos um produto para importar.'); return; }
  for(const it of validos){
    await registrarEntrada({
      productCode: it.productCode, qty: it.quantidade, lote:'', validade:'',
      invoiceNumber, unitCost: it.valorUnit, fornecedor
    });
  }
  showToast(`${validos.length} item(ns) importado(s) da nota.`);
  parsedNfItems = [];
  renderCompras();
}

/* ======================= RENDER: ALERTAS ======================= */
function renderAlertas(){
  const low = state.products.filter(p=>stockStatus(p)!=='ok');
  const exp = state.products
    .map(p=>({p, nv: nearestValidade(p)}))
    .filter(x=>x.nv && daysUntil(x.nv.validade)<=7)
    .sort((a,b)=> a.nv.validade < b.nv.validade ? -1:1);

  let html = `<div class="panel">
    <h2>Estoque baixo ou crítico</h2>
    ${low.length? `<div class="tbl-wrap"><table>
      <tr><th>Código</th><th>Produto</th><th>Atual</th><th>Mínimo</th><th>Sugestão de compra</th><th>Status</th></tr>
      ${low.map(p=>{
        const status = stockStatus(p);
        const suggestion = Math.max(0, p.max - totalStock(p));
        return `<tr>
          <td><code class="code">${p.code}</code></td>
          <td>${p.name}</td>
          <td>${totalStock(p)} ${p.unit}</td>
          <td>${p.min} ${p.unit}</td>
          <td>${suggestion} ${p.unit}</td>
          <td><span class="pill ${status}">${status==='crit'?'Crítico':'Baixo'}</span></td>
        </tr>`;
      }).join('')}
    </table></div>` : '<p class="empty">Nenhum produto com estoque baixo.</p>'}
  </div>

  <div class="panel">
    <h2>Validade próxima ou vencida</h2>
    ${exp.length? `<div class="tbl-wrap"><table>
      <tr><th>Código</th><th>Produto</th><th>Lote</th><th>Qtd</th><th>Validade</th><th>Situação</th></tr>
      ${exp.map(({p,nv})=>{
        const d = daysUntil(nv.validade);
        const lvl = d<0?'crit':(d<=3?'crit':'warn');
        const lbl = d<0?`Vencido há ${Math.abs(d)}d`:(d===0?'Vence hoje':`${d} dia(s)`);
        return `<tr>
          <td><code class="code">${p.code}</code></td>
          <td>${p.name}</td>
          <td>${nv.lote||'—'}</td>
          <td>${nv.qty} ${p.unit}</td>
          <td>${fmtDate(nv.validade)}</td>
          <td><span class="pill ${lvl}">${lbl}</span></td>
        </tr>`;
      }).join('')}
    </table></div>` : '<p class="empty">Nenhum lote vencendo nos próximos 7 dias.</p>'}
  </div>`;
  document.getElementById('content').innerHTML = html;
}

/* ======================= RENDER: BACKUP ======================= */
function renderBackup(){
  const html = `<div class="banner warn">
    Os dados agora ficam salvos na nuvem (Firestore) e sincronizam entre todos os aparelhos automaticamente.
    O backup aqui é uma cópia extra de segurança, não a forma principal de salvar.
  </div>
  <div class="panel">
    <h2>Exportar backup</h2>
    <p class="muted">Baixa um arquivo com todos os produtos, movimentações e notas fiscais atuais.</p>
    <button class="btn btn-primary" onclick="exportarBackup()">Baixar backup (.json)</button>
  </div>
  <div class="panel">
    <h2>Importar backup</h2>
    <p class="muted">Envia os dados de um arquivo de backup para o banco de dados na nuvem (não apaga o que já existe; produtos com o mesmo código são atualizados).</p>
    <input type="file" accept="application/json" onchange="importarBackup(this)">
  </div>`;
  document.getElementById('content').innerHTML = html;
}

function exportarBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sol-nascente-estoque-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup exportado.');
}
function importarBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.products || !Array.isArray(parsed.products)) throw new Error('formato inválido');
      if(!confirm('Importar este backup para a nuvem? Produtos com o mesmo código serão sobrescritos.')) return;
      const batch = db.batch();
      parsed.products.forEach(p=>{
        const ref = productsCol.doc(p.code);
        batch.set(ref, { name:p.name, category:p.category, unit:p.unit, location:p.location||'', min:p.min||0, max:p.max||0, lastCost:p.lastCost||0, batches:p.batches||[] });
      });
      await batch.commit();
      showToast('Backup importado com sucesso.');
    }catch(err){
      showToast('Arquivo de backup inválido.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ======================= RENDER PRINCIPAL ======================= */
function render(){
  if(!loaded){
    document.getElementById('content').innerHTML = '<div class="panel"><p class="empty">Sincronizando dados…</p></div>';
    return;
  }
  renderTabs();
  if(currentTab==='painel') renderPainel();
  else if(currentTab==='produtos') renderProdutos();
  else if(currentTab==='entrada') renderEntrada();
  else if(currentTab==='saida') renderSaida();
  else if(currentTab==='compras') renderCompras();
  else if(currentTab==='alertas') renderAlertas();
  else if(currentTab==='backup') renderBackup();
}
